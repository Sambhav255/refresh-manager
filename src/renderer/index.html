<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refresh Manager</title>
</head>
<body>
  <div id="stage">
    <div id="scaler">
      <div id="root"></div>
    </div>
  </div>
  <div class="kbd-hint" id="hint"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    function fitStage() {
      var winW = 1200, winH = 800, pad = 68;
      var s = Math.min((window.innerWidth - pad) / winW, (window.innerHeight - pad) / winH);
      s = Math.min(s, 1.05);
      var el = document.getElementById('scaler');
      if (el) el.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fitStage);
    window.__fitStage = fitStage;
    fitStage();
  </script>
</body>
</html>
