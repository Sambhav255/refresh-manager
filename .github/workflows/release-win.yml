name: Release Windows

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-rebuild

      - name: Test
        run: npm test

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: refresh-manager-win-release
          path: dist-app/*.exe

      - name: Create GitHub Release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          INSTALLER="dist-app/Refresh Manager-${VERSION}-setup.exe"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${INSTALLER}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Refresh Manager ${VERSION}" \
              --notes-file CHANGELOG.md \
              "${INSTALLER}#Refresh Manager ${VERSION} Setup"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
